<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#073a69"><title>חמדת | מצב חג</title><style>*{box-sizing:border-box}body{margin:0;background:#edf4f8;font-family:Arial,sans-serif;color:#18324a}.app{max-width:650px;margin:auto;background:#fff;min-height:100vh}.hero{text-align:center;padding:22px;background:#eef8fd}.hero h1{margin:0;color:#073a69;font-size:42px}.hero p{margin:7px 0 0;color:#587086}.banner{margin:0 15px;padding:20px;border-radius:20px;background:#073a69;color:#fff;text-align:center}.banner h2{margin:4px;font-size:28px}.grid{padding:14px}.card{margin-bottom:14px;border:1px solid #dde6ee;border-radius:18px;overflow:hidden}.title{padding:13px 16px;background:#f2f8fc;color:#073a69;font-size:19px;font-weight:800}.row{display:grid;grid-template-columns:78px 1fr minmax(90px,auto);gap:10px;padding:12px 14px;border-top:1px solid #edf1f4;align-items:center}.time{font-weight:900;font-size:18px;direction:ltr;color:#073a69}.event{font-weight:700}.person{font-size:14px;color:#6a5439;font-weight:700}.notice{padding:16px;white-space:pre-wrap;line-height:1.5;color:#667786}.btn{width:100%;border:0;border-radius:14px;padding:14px;margin-top:9px;font:inherit;font-weight:800;cursor:pointer}.primary{background:#073a69;color:white}.secondary{background:#e7f1f8;color:#073a69}.danger{background:#f9e7e7;color:#8b2f2f}dialog{border:0;border-radius:20px;width:min(94vw,570px);padding:0}dialog::backdrop{background:#0007}.dlg{padding:20px;max-height:88vh;overflow:auto}input,textarea,select{width:100%;padding:10px;border:1px solid #ccd7df;border-radius:9px;margin:4px 0 9px;font:inherit}.editrow{border:1px solid #e1e7ec;border-radius:12px;padding:9px;margin:8px 0}.three{display:grid;grid-template-columns:90px 1fr 1fr;gap:6px}.hidden{display:none}.status{font-size:13px;margin:8px 0}.ok{color:#176b3a}.footer{text-align:center;padding:18px;background:#073a69;color:#fff}@media(max-width:480px){.row{grid-template-columns:70px 1fr}.person{grid-column:2}.three{grid-template-columns:80px 1fr}.three .personInput{grid-column:1/3}}</style></head><body><main class="app"><section class="hero"><h1>חמדת</h1><p>בית הכנסת במושב חמד</p></section><section class="banner"><div>לוח חג מיוחד</div><h2 id="holidayName">ראש השנה</h2><div id="holidayDate">א׳-ב׳ תשרי</div></section><div class="grid"><div id="days"></div><section class="card"><div class="title">📢 הודעות החג</div><div id="holidayNotice" class="notice">שנה טובה ומתוקה</div></section><button class="btn primary" id="shareBtn">💬 שליחת לוח החג ב-WhatsApp</button><button class="btn secondary" id="adminBtn">🔒 עריכת לוח החג</button><a class="btn secondary" style="display:block;text-align:center;text-decoration:none" href="./">חזרה ללוח השבת</a></div><div class="footer">חמדת • בית הכנסת מושב חמד</div></main><dialog id="admin"><div class="dlg"><div id="loginBox"><h2>כניסת מנהל</h2><input id="email" type="email" placeholder="אימייל"><input id="password" type="password" placeholder="סיסמה"><button class="btn primary" id="loginBtn">כניסה</button><div id="loginStatus" class="status"></div></div><div id="editor" class="hidden"><h2>עריכת מצב חג</h2><label>שם החג</label><input id="nameInput"><label>תאריך עברי / כותרת משנה</label><input id="dateInput"><label>הודעות החג</label><textarea id="noticeInput"></textarea><h3>יום ראשון</h3><div id="day1edit"></div><button class="btn secondary" data-add="1">+ הוספת שורה ליום ראשון</button><h3>יום שני</h3><div id="day2edit"></div><button class="btn secondary" data-add="2">+ הוספת שורה ליום שני</button><button class="btn primary" id="saveBtn">שמור ופרסם</button><button class="btn danger" id="logoutBtn">התנתקות</button><div id="saveStatus" class="status"></div></div><button class="btn secondary" id="closeBtn">סגור</button></div></dialog><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js';import{getFirestore,doc,onSnapshot,setDoc}from'https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js';import{getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged}from'https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js';const cfg={apiKey:'AIzaSyA0go6E8cJZG371djrkTWgnfqibvrEZe9o',authDomain:'hemdat-c9c0f.firebaseapp.com',projectId:'hemdat-c9c0f',storageBucket:'hemdat-c9c0f.firebasestorage.app',messagingSenderId:'725336060244',appId:'1:725336060244:web:0a6fe2d3bb9945950198c1'};const app=initializeApp(cfg),db=getFirestore(app),auth=getAuth(app),ref=doc(db,'site','holiday');const seed={name:'ראש השנה',date:'א׳-ב׳ תשרי',notice:'שנה טובה ומתוקה',days:[{title:'יום ראשון',rows:[{time:'18:15',event:'כניסת החג',person:''},{time:'18:25',event:'מנחה',person:''},{time:'19:10',event:'ערבית',person:'יוסי בן עליז'},{time:'08:00',event:'פסוקי דזמרה',person:'דני מילר'},{time:'',event:'שחרית',person:'רוני פורר'},{time:'',event:'קריאה בתורה',person:'אסף אידלמן'},{time:'',event:'דבר תורה',person:'שמואל שפרינגר'},{time:'',event:'מקריא לתוקע',person:'נדב דולינסקי'},{time:'~10:00',event:'תקיעת שופר',person:'עמית גליק'},{time:'',event:'מוסף',person:'יניב קוך'},{time:'18:00',event:'מנחה ותשליך',person:'אריאל שחם'},{time:'18:35',event:'שיעור בענייני היום',person:'אמיתי כובשי'},{time:'19:11',event:'ערבית ערב שני',person:'יניב קוך'}]},{title:'יום שני',rows:[{time:'08:00',event:'פסוקי דזמרה',person:'נדב דולינסקי'},{time:'',event:'שחרית',person:'יאיר שרדני'},{time:'',event:'קריאה בתורה',person:'נועם שרביט'},{time:'',event:'דבר תורה',person:'עמית גליק'},{time:'',event:'מקריא לתוקע',person:'נדב דולינסקי'},{time:'~10:00',event:'תקיעת שופר',person:'ארז פייגה'},{time:'',event:'מוסף',person:'אושריאל שטראובר'},{time:'18:15',event:'מנחה',person:'אמיתי כובשי'},{time:'19:11',event:'צאת החג וערבית',person:''}]}]};let data=seed;const $=x=>document.getElementById(x);function render(){ $('holidayName').textContent=data.name;$('holidayDate').textContent=data.date;$('holidayNotice').textContent=data.notice||'';let d=$('days');d.innerHTML='';data.days.forEach(day=>{let c=document.createElement('section');c.className='card';c.innerHTML='<div class="title"></div>';c.querySelector('.title').textContent=day.title;day.rows.forEach(x=>{let r=document.createElement('div');r.className='row';r.innerHTML='<div class="time"></div><div class="event"></div><div class="person"></div>';r.children[0].textContent=x.time||'';r.children[1].textContent=x.event||'';r.children[2].textContent=x.person||'';c.appendChild(r)});d.appendChild(c)})}function addEdit(day,x={}){let w=document.createElement('div');w.className='editrow';w.innerHTML='<div class="three"><input class="t" placeholder="שעה"><input class="e" placeholder="תפילה / תפקיד"><input class="p personInput" placeholder="חזן / קורא / בעל תפקיד"></div><button class="btn danger" type="button">הסר שורה</button>';w.querySelector('.t').value=x.time||'';w.querySelector('.e').value=x.event||'';w.querySelector('.p').value=x.person||'';w.querySelector('button').onclick=()=>w.remove();$(day===1?'day1edit':'day2edit').appendChild(w)}function fill(){ $('nameInput').value=data.name;$('dateInput').value=data.date;$('noticeInput').value=data.notice||'';$('day1edit').innerHTML='';$('day2edit').innerHTML='';data.days[0].rows.forEach(x=>addEdit(1,x));data.days[1].rows.forEach(x=>addEdit(2,x))}function rows(id){return[...$(id).children].map(w=>({time:w.querySelector('.t').value.trim(),event:w.querySelector('.e').value.trim(),person:w.querySelector('.p').value.trim()})).filter(x=>x.time||x.event||x.person)}onSnapshot(ref,s=>{if(s.exists())data=s.data();render();fill()});render();$('adminBtn').onclick=()=>$('admin').showModal();$('closeBtn').onclick=()=>$('admin').close();document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>addEdit(+b.dataset.add));$('loginBtn').onclick=async()=>{try{await signInWithEmailAndPassword(auth,$('email').value.trim(),$('password').value)}catch(e){$('loginStatus').textContent='הכניסה נכשלה. בדוק אימייל וסיסמה.'}};onAuthStateChanged(auth,u=>{if(u){$('loginBox').classList.add('hidden');$('editor').classList.remove('hidden');fill()}else{$('loginBox').classList.remove('hidden');$('editor').classList.add('hidden')}});$('logoutBtn').onclick=()=>signOut(auth);$('saveBtn').onclick=async()=>{let n={name:$('nameInput').value.trim()||'חג',date:$('dateInput').value.trim(),notice:$('noticeInput').value.trim(),days:[{title:'יום ראשון',rows:rows('day1edit')},{title:'יום שני',rows:rows('day2edit')}],updatedAt:new Date().toISOString()};try{await setDoc(ref,n);data=n;render();$('saveStatus').className='status ok';$('saveStatus').textContent='לוח החג פורסם בהצלחה.'}catch(e){$('saveStatus').textContent='השמירה נכשלה. יש לבדוק הרשאות Firestore.'}};$('shareBtn').onclick=()=>{let text=`חמדת - ${data.name}\n${data.date}\n`;data.days.forEach(d=>{text+=`\n${d.title}\n`;d.rows.forEach(x=>text+=`${x.time?x.time+' ':''}${x.event}${x.person?' - '+x.person:''}\n`)});if(data.notice)text+=`\nהודעות:\n${data.notice}`;window.open('https://wa.me/?text='+encodeURIComponent(text),'_blank')};</script></body></html>
