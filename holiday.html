<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#073a69"><title>חמדת | לוח חג ושבת</title><style>*{box-sizing:border-box}body{margin:0;background:#edf4f8;font-family:Arial,sans-serif;color:#18324a}.app{max-width:680px;margin:auto;background:#fff;min-height:100vh}.hero{text-align:center;padding:22px;background:#eef8fd}.hero h1{margin:0;color:#073a69;font-size:42px}.hero p{margin:7px 0 0;color:#587086}.banner{margin:0 15px;padding:20px;border-radius:20px;background:#073a69;color:#fff;text-align:center}.banner h2{margin:4px;font-size:28px}.statusBadge{display:inline-block;margin-top:10px;padding:7px 12px;border-radius:999px;font-size:13px;font-weight:800;background:#ffffff22}.grid{padding:14px}.card{margin-bottom:14px;border:1px solid #dde6ee;border-radius:18px;overflow:hidden}.title{padding:13px 16px;background:#f2f8fc;color:#073a69;font-size:19px;font-weight:800}.row{display:grid;grid-template-columns:78px 1fr minmax(90px,auto);gap:10px;padding:12px 14px;border-top:1px solid #edf1f4;align-items:center}.time{font-weight:900;font-size:18px;direction:ltr;color:#073a69}.event{font-weight:700}.person{font-size:14px;color:#6a5439;font-weight:700}.notice{padding:16px;white-space:pre-wrap;line-height:1.5;color:#667786}.btn{width:100%;border:0;border-radius:14px;padding:14px;margin-top:9px;font:inherit;font-weight:800;cursor:pointer}.primary{background:#073a69;color:#fff}.secondary{background:#e7f1f8;color:#073a69}.danger{background:#f9e7e7;color:#8b2f2f}.toggleBox{display:flex;align-items:center;gap:10px;background:#eef8fd;border:1px solid #cfe5f2;border-radius:12px;padding:12px;margin:10px 0 15px}.toggleBox input{width:auto;margin:0;transform:scale(1.25)}dialog{border:0;border-radius:20px;width:min(94vw,610px);padding:0}dialog::backdrop{background:#0007}.dlg{padding:20px;max-height:90vh;overflow:auto;position:relative}.closeX{position:sticky;top:0;float:left;z-index:5;width:38px;height:38px;border:0;border-radius:50%;background:#eef2f5;color:#17324a;font-size:25px;cursor:pointer;margin:-6px 0 6px -6px}input,textarea{width:100%;padding:10px;border:1px solid #ccd7df;border-radius:9px;margin:4px 0 9px;font:inherit}.segmentEdit{border:2px solid #dbe7ef;border-radius:15px;padding:12px;margin:14px 0;background:#fbfdff}.segmentHead{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}.editrow{border:1px solid #e1e7ec;border-radius:12px;padding:9px;margin:8px 0}.three{display:grid;grid-template-columns:90px 1fr 1fr;gap:6px}.smallbtn{width:auto;padding:9px 12px;margin:0}.hidden{display:none}.status{font-size:13px;margin:8px 0}.ok{color:#176b3a}.footer{text-align:center;padding:18px;background:#073a69;color:#fff}@media(max-width:480px){.row{grid-template-columns:70px 1fr}.person{grid-column:2}.three{grid-template-columns:80px 1fr}.three .personInput{grid-column:1/3}}</style></head><body><main class="app"><section class="hero"><h1>חמדת</h1><p>בית הכנסת במושב חמד</p></section><section class="banner"><div>לוח מיוחד לשבת ולחג</div><h2 id="holidayName">ראש השנה</h2><div id="holidayDate">א׳-ב׳ תשרי</div><div class="statusBadge" id="activeBadge">מצב חג אינו פעיל בדף הראשי</div></section><div class="grid"><div id="segments"></div><section class="card"><div class="title">📢 הודעות</div><div id="holidayNotice" class="notice"></div></section><button class="btn primary" id="shareBtn">💬 שליחת הלוח ב-WhatsApp</button><button class="btn secondary" id="adminBtn">🔒 עריכת הלוח המיוחד</button><a class="btn secondary" style="display:block;text-align:center;text-decoration:none" href="./">חזרה ללוח השבת</a></div><div class="footer">חמדת • בית הכנסת מושב חמד</div></main><dialog id="admin"><div class="dlg"><button class="closeX" id="closeX" type="button">×</button><div id="loginBox"><h2>כניסת מנהל</h2><input id="email" type="email" placeholder="אימייל"><input id="password" type="password" placeholder="סיסמה"><button class="btn primary" id="loginBtn">כניסה</button><div id="loginStatus" class="status"></div></div><div id="editor" class="hidden"><h2>עריכת לוח שבת וחג</h2><label class="toggleBox"><input id="activeInput" type="checkbox"><span><strong>הפעל לוח מיוחד בדף הראשי</strong><br><small>מתאים גם לחג שחל בשבת או מתחיל במוצאי שבת.</small></span></label><label>כותרת הלוח</label><input id="nameInput" placeholder="למשל: שבת וראש השנה"><label>תאריך / כותרת משנה</label><input id="dateInput"><label>הודעות</label><textarea id="noticeInput"></textarea><h3>מקטעי הלוח</h3><div id="segmentEditors"></div><button class="btn secondary" id="addSegmentBtn">+ הוספת מקטע / יום</button><button class="btn primary" id="saveBtn">שמור ופרסם</button><button class="btn danger" id="logoutBtn">התנתקות</button><div id="saveStatus" class="status"></div></div><button class="btn secondary" id="closeBtn">סגור</button></div></dialog><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js';import{getFirestore,doc,onSnapshot,setDoc}from'https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js';import{getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged}from'https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js';const cfg={apiKey:'AIzaSyA0go6E8cJZG371djrkTWgnfqibvrEZe9o',authDomain:'hemdat-c9c0f.firebaseapp.com',projectId:'hemdat-c9c0f',storageBucket:'hemdat-c9c0f.firebasestorage.app',messagingSenderId:'725336060244',appId:'1:725336060244:web:0a6fe2d3bb9945950198c1'};const app=initializeApp(cfg),db=getFirestore(app),auth=getAuth(app),ref=doc(db,'site','holiday');const seed={active:false,name:'ראש השנה',date:'א׳-ב׳ תשרי',notice:'שנה טובה ומתוקה',segments:[{title:'יום ראשון',rows:[]},{title:'יום שני',rows:[]}]};let data=seed;const $=x=>document.getElementById(x);function normalize(x){let segments=x.segments;if(!segments&&x.days)segments=x.days.map(d=>({title:d.title,rows:d.rows||[]}));return{...seed,...x,segments:segments||seed.segments}}function render(){$('holidayName').textContent=data.name||'לוח מיוחד';$('holidayDate').textContent=data.date||'';$('holidayNotice').textContent=data.notice||'';$('activeBadge').textContent=data.active?'הלוח המיוחד פעיל בדף הראשי':'הלוח המיוחד אינו פעיל בדף הראשי';let box=$('segments');box.innerHTML='';(data.segments||[]).forEach(seg=>{let c=document.createElement('section');c.className='card';c.innerHTML='<div class="title"></div>';c.querySelector('.title').textContent=seg.title||'מקטע';(seg.rows||[]).forEach(x=>{let r=document.createElement('div');r.className='row';r.innerHTML='<div class="time"></div><div class="event"></div><div class="person"></div>';r.children[0].textContent=x.time||'';r.children[1].textContent=x.event||'';r.children[2].textContent=x.person||'';c.appendChild(r)});box.appendChild(c)})}function addRowEditor(container,x={}){let w=document.createElement('div');w.className='editrow';w.innerHTML='<div class="three"><input class="t" placeholder="שעה"><input class="e" placeholder="תפילה / אירוע"><input class="p personInput" placeholder="חזן / קורא / בעל תפקיד"></div><button class="btn danger" type="button">הסר שורה</button>';w.querySelector('.t').value=x.time||'';w.querySelector('.e').value=x.event||'';w.querySelector('.p').value=x.person||'';w.querySelector('button').onclick=()=>w.remove();container.appendChild(w)}function addSegmentEditor(seg={title:'מקטע חדש',rows:[]}){let s=document.createElement('div');s.className='segmentEdit';s.innerHTML='<div class="segmentHead"><input class="segTitle" placeholder="כותרת, למשל: מוצאי שבת - ליל חג"><button type="button" class="btn danger smallbtn">הסר מקטע</button></div><div class="rows"></div><button type="button" class="btn secondary addRow">+ הוספת שורה</button>';s.querySelector('.segTitle').value=seg.title||'';let rows=s.querySelector('.rows');(seg.rows||[]).forEach(x=>addRowEditor(rows,x));s.querySelector('.addRow').onclick=()=>addRowEditor(rows);s.querySelector('.danger').onclick=()=>s.remove();$('segmentEditors').appendChild(s)}function fill(){$('activeInput').checked=!!data.active;$('nameInput').value=data.name||'';$('dateInput').value=data.date||'';$('noticeInput').value=data.notice||'';$('segmentEditors').innerHTML='';(data.segments||[]).forEach(addSegmentEditor)}function collect(){return[...$('segmentEditors').children].map(s=>({title:s.querySelector('.segTitle').value.trim()||'מקטע',rows:[...s.querySelector('.rows').children].map(w=>({time:w.querySelector('.t').value.trim(),event:w.querySelector('.e').value.trim(),person:w.querySelector('.p').value.trim()})).filter(x=>x.time||x.event||x.person)}))}onSnapshot(ref,s=>{if(s.exists())data=normalize(s.data());render();fill()});render();$('adminBtn').onclick=()=>$('admin').showModal();$('closeBtn').onclick=$('closeX').onclick=()=>$('admin').close();$('addSegmentBtn').onclick=()=>addSegmentEditor();$('loginBtn').onclick=async()=>{try{await signInWithEmailAndPassword(auth,$('email').value.trim(),$('password').value)}catch(e){$('loginStatus').textContent='הכניסה נכשלה. בדוק אימייל וסיסמה.'}};onAuthStateChanged(auth,u=>{if(u){$('loginBox').classList.add('hidden');$('editor').classList.remove('hidden');fill()}else{$('loginBox').classList.remove('hidden');$('editor').classList.add('hidden')}});$('logoutBtn').onclick=()=>signOut(auth);$('saveBtn').onclick=async()=>{let n={active:$('activeInput').checked,name:$('nameInput').value.trim()||'לוח מיוחד',date:$('dateInput').value.trim(),notice:$('noticeInput').value.trim(),segments:collect(),updatedAt:new Date().toISOString()};try{await setDoc(ref,n);data=n;render();$('saveStatus').className='status ok';$('saveStatus').textContent='הלוח פורסם בהצלחה.'}catch(e){$('saveStatus').textContent='השמירה נכשלה. יש לבדוק הרשאות Firestore.'}};$('shareBtn').onclick=()=>{let text=`חמדת - ${data.name}\n${data.date}\n`;data.segments.forEach(s=>{text+=`\n${s.title}\n`;s.rows.forEach(x=>text+=`${x.time?x.time+' ':''}${x.event}${x.person?' - '+x.person:''}\n`)});if(data.notice)text+=`\nהודעות:\n${data.notice}`;window.open('https://wa.me/?text='+encodeURIComponent(text),'_blank')};</script></body></html>
